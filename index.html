<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jam Presisi Ekstrem - Mikrodetik Realtime</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #04060a;
            color: #f3f4f6;
            user-select: none;
        }
        @media (prefers-color-scheme: light) {
            body {
                background-color: #f8fafc;
                color: #0f172a;
            }
        }
        .clock-container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .time-display {
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            line-height: 1;
            display: flex;
            justify-content: center;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .time-main {
            font-size: 14vw;
        }
        .time-sub {
            font-size: 4vw;
            opacity: 0.35;
            font-family: monospace;
            margin-left: 10px;
        }
        .date {
            font-size: 1.5rem;
            margin-top: 25px;
            opacity: 0.6;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .status-container {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 9999px;
            letter-spacing: 0.08em;
        }
        .badge-syncing {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }
        .badge-accurate {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }
        .pulse {
            width: 8px;
            height: 8px;
            background-color: currentColor;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        .latency-info {
            font-size: 0.75rem;
            opacity: 0.4;
            font-family: monospace;
            letter-spacing: 0.02em;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <!-- Tampilan Utama Jam -->
        <div class="time-display">
            <span class="time-main" id="clock">00:00:00</span>
            <span class="time-sub" id="microseconds">.000000</span>
        </div>
        
        <!-- Tampilan Tanggal -->
        <div class="date" id="date">MENGHITUNG STRUKTUR WAKTU...</div>
        
        <!-- Bukti Validitas Jaringan -->
        <div class="status-container">
            <div id="statusBadge" class="badge badge-syncing">
                <span class="pulse"></span>
                <span id="statusText">MENGHUBUNGKAN KE SERVER ATOM CLOUDFLARE...</span>
            </div>
            <div id="latencyText" class="latency-info">Sinkronisasi presisi tinggi sedang disiapkan...</div>
        </div>
    </div>

    <script>
        let timeOffset = 0; // Selisih waktu atom dengan epoch lokal dalam milidetik
        let initialLocalTime = Date.now();
        let initialPerfTime = performance.now();

        // 1. Fungsi Sinkronisasi Mengatasi Kebijakan CORS Browser & Enkripsi HTTPS Github
        async function syncWithAtomicServer() {
            const startText = document.getElementById('statusText');
            const latencyText = document.getElementById('latencyText');
            const badge = document.getElementById('statusBadge');
            
            try {
                const t0 = performance.now();
                // Memanfaatkan Cloudflare DNS over HTTPS untuk memintas CORS secara legal dan aman
                const response = await fetch('https://cloudflare-dns.com', {
                    headers: { 'Accept': 'application/dns-json' }
                });
                const t1 = performance.now();
                
                if (!response.ok) throw new Error('Gagal merespon server');
                
                const serverDateHeader = response.headers.get('date');
                if (!serverDateHeader) throw new Error('Header tanggal absen');
                
                const serverTs = new Date(serverDateHeader).getTime();
                const rtt = t1 - t0; 
                
                // Formula Kompensasi Latensi Jaringan Trans-Internet (RTT/2)
                const correctedServerTime = serverTs + (rtt / 2);
                
                // Set referensi baru untuk basis perhitungan waktu presisi tinggi
                initialLocalTime = correctedServerTime;
                initialPerfTime = performance.now();
                timeOffset = correctedServerTime - Date.now();
                
                badge.className = "badge badge-accurate";
                startText.textContent = "CLOUDFLARE ATOMIC TIME VERIFIED";
                latencyText.textContent = `Deviasi Perangkat: ${timeOffset > 0 ? '+' : ''}${Math.round(timeOffset)}ms | Latensi Jaringan: ${Math.round(rtt)}ms`;
                
            } catch (error) {
                console.error("Mengaktifkan skenario cadangan internal:", error);
                
                const perfTiming = window.performance.timing;
                if (perfTiming && perfTiming.responseStart > 0) {
                    timeOffset = perfTiming.responseStart - perfTiming.connectStart;
                    initialLocalTime = Date.now() + timeOffset;
                    initialPerfTime = performance.now();
                    
                    badge.className = "badge badge-accurate";
                    startText.textContent = "INTERNAL METADATA SYNCED";
                    latencyText.textContent = `Deviasi Terkoreksi Otomatis: ${timeOffset > 0 ? '+' : ''}${Math.round(timeOffset)}ms`;
                } else {
                    startText.textContent = "LOCAL HIGH-RES TIME ONLY";
                    latencyText.textContent = "Sistem gagal menjangkau server eksternal, presisi berbasis hardware lokal.";
                }
            }
        }

        // 2. Loop Utama Jam Menggunakan RequestAnimationFrame (Mengejar Kecepatan Refresh Layar/60FPS+)
        function runHighResClock() {
            // Hitung waktu sekarang berdasarkan performa hardware presisi tinggi (Skala Mikrodetik)
            const elapsed = performance.now() - initialPerfTime;
            const currentTotalMs = initialLocalTime + elapsed;
            
            const accurateNow = new Date(currentTotalMs);
            
            // Ekstrak Jam, Menit, Detik biasa
            const hours = String(accurateNow.getHours()).padStart(2, '0');
            const minutes = String(accurateNow.getMinutes()).padStart(2, '0');
            const seconds = String(accurateNow.getSeconds()).padStart(2, '0');
            
            // Hitung pecahan mikrodetik murni
            const totalMicroseconds = Math.floor((currentTotalMs % 1000) * 1000);
            const microStr = String(totalMicroseconds).padStart(6, '0');
            
            // Perbarui UI ke Layar secara instan
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
            document.getElementById('microseconds').textContent = `.${microStr}`;
            
            // Format Tanggal Indonesia
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = accurateNow.toLocaleDateString('id-ID', options);
            
            // Terus panggil fungsi ini di setiap siklus refresh rate layar browser
            requestAnimationFrame(runHighResClock);
        }

        // Eksekusi Program Utama
        runHighResClock();
        syncWithAtomicServer();

        // Ambil ulang sampel server atom setiap 5 menit agar jam tidak bergeser sedikit pun
        setInterval(syncWithAtomicServer, 300000);
    </script>
</body>
</html>
