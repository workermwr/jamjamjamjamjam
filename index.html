    <script>
        let timeOffset = 0; // Selisih waktu lokal dengan waktu server dalam milidetik

        // Fungsi sinkronisasi dengan Server Waktu Dunia yang bebas CORS
        async function syncWithServer() {
            const startText = document.getElementById('statusText');
            const latencyText = document.getElementById('latencyText');
            const badge = document.getElementById('statusBadge');
            
            try {
                const t0 = performance.now();
                // Menggunakan API waktu dunia yang mendukung CORS publik
                const response = await fetch('https://worldtimeapi.org' + Date.now());
                const t1 = performance.now();
                
                if (!response.ok) throw new Error('Respon server tidak ok');
                
                const data = await response.json();
                
                // worldtimeapi mengembalikan epoch dalam bentuk detik (data.unixtime) ditambah sisa pecahan mikrodetik
                // Kita gunakan data.datetime untuk presisi penuh lewat objek Date bawaan javascript
                const serverTs = new Date(data.datetime).getTime();
                
                if (serverTs > 0) {
                    const rtt = t1 - t0; // Round Trip Time (Latensi Jaringan)
                    const correctedServerTime = serverTs + (rtt / 2); // Kompensasi latensi
                    const localTime = Date.now();
                    
                    // Hitung berapa milidetik jam internal user meleset
                    timeOffset = correctedServerTime - localTime;
                    
                    // Ubah UI menjadi status Akurat Terverifikasi
                    badge.className = "badge badge-accurate";
                    startText.textContent = "NTP WORLD TIME SYNCED";
                    latencyText.textContent = `Deviasi Perangkat: ${timeOffset > 0 ? '+' : ''}${Math.round(timeOffset)}ms | Latensi: ${Math.round(rtt)}ms`;
                }
            } catch (error) {
                console.error("Gagal sinkronisasi, mencoba fallback HTTP API:", error);
                
                // Fallback kedua menggunakan kelebihan header waktu dari WorldClockAPI jika API pertama down
                try {
                    const t0 = performance.now();
                    const response = await fetch('https://jsontest.com' + Date.now());
                    const t1 = performance.now();
                    const data = await response.json();
                    const serverTs = data.milliseconds_since_epoch;
                    
                    const rtt = t1 - t0;
                    timeOffset = (serverTs + (rtt / 2)) - Date.now();
                    
                    badge.className = "badge badge-accurate";
                    startText.textContent = "BACKUP TIME SYNCED";
                    latencyText.textContent = `Deviasi Perangkat: ${timeOffset > 0 ? '+' : ''}${Math.round(timeOffset)}ms | Latensi: ${Math.round(rtt)}ms`;
                } catch (fallbackError) {
                    startText.textContent = "LOCAL TIME ONLY (CORS/TIMEOUT)";
                    latencyText.textContent = "Gagal memverifikasi deviasi jaringan.";
                }
            }
        }

        function updateClock() {
            // Dapatkan waktu lokal saat ini lalu koreksi dengan selisih waktu server
            const localNow = Date.now();
            const accurateNow = new Date(localNow + timeOffset);
            
            // Format Jam (HH:MM:SS)
            const hours = String(accurateNow.getHours()).padStart(2, '0');
            const minutes = String(accurateNow.getMinutes()).padStart(2, '0');
            const seconds = String(accurateNow.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
            
            // Format Tanggal Indonesia
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = accurateNow.toLocaleDateString('id-ID', options);
            
            // Atur agar loop berikutnya berjalan tepat di milidetik ke-0 di detik berikutnya
            const nextTickDelay = 1000 - (accurateNow.getMilliseconds());
            setTimeout(updateClock, nextTickDelay);
        }

        // Jalankan logika
        updateClock();      
        syncWithServer();   

        // Sinkronisasi ulang setiap 5 menit
        setInterval(syncWithServer, 300000);
    </script>
