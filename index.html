<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jam Presisi Ekstrem & Generator Seni Mikrodetik</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #04060a;
            color: #f3f4f6;
            user-select: none;
            overflow: hidden;
            position: relative;
        }
        /* Kanvas seni latar belakang yang digenerate per milidetik */
        #artCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15; /* Menjaga agar jam tetap kontras dan mudah dibaca */
            pointer-events: none;
        }
        .clock-container {
            text-align: center;
            padding: 40px;
            width: 90%;
            max-width: 1000px;
            z-index: 2;
            background: rgba(4, 6, 10, 0.75);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .time-display {
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            line-height: 1;
            display: flex;
            justify-content: center;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .time-main {
            font-size: 12vw;
        }
        .time-sub {
            font-size: 3.5vw;
            opacity: 0.4;
            font-family: monospace;
            margin-left: 10px;
            color: #34d399;
        }
        .date {
            font-size: 1.4rem;
            margin-top: 25px;
            opacity: 0.6;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .status-container {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 9999px;
            letter-spacing: 0.08em;
        }
        .badge-syncing {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }
        .badge-accurate {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }
        .pulse {
            width: 8px;
            height: 8px;
            background-color: currentColor;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        .latency-info {
            font-size: 0.75rem;
            opacity: 0.4;
            font-family: monospace;
            letter-spacing: 0.02em;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <!-- Elemen Canvas untuk generate gambar realtime -->
    <canvas id="artCanvas"></canvas>

    <div class="clock-container">
        <!-- Tampilan Utama Jam -->
        <div class="time-display">
            <span class="time-main" id="clock">00:00:00</span>
            <span class="time-sub" id="microseconds">.000000</span>
        </div>
        
        <!-- Tampilan Tanggal -->
        <div class="date" id="date">MEMPROSES SIMULASI WAKTU...</div>
        
        <!-- Bukti Validitas Jaringan -->
        <div class="status-container">
            <div id="statusBadge" class="badge badge-syncing">
                <span class="pulse"></span>
                <span id="statusText">MENGHUBUNGKAN KE SERVER ATOM CLOUDFLARE...</span>
            </div>
            <div id="latencyText" class="latency-info">Sinkronisasi presisi tinggi sedang disiapkan...</div>
        </div>
    </div>
    <script>
        let timeOffset = 0; 
        let initialLocalTime = Date.now();
        let initialPerfTime = performance.now();

        // Konfigurasi Kanvas Seni Latar Belakang
        const canvas = document.getElementById('artCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 1. Sinkronisasi Otomatis dengan Server Atom Cloudflare
        async function syncWithAtomicServer() {
            const startText = document.getElementById('statusText');
            const latencyText = document.getElementById('latencyText');
            const badge = document.getElementById('statusBadge');
            
            try {
                const t0 = performance.now();
                // Mengakses DNS over HTTPS Cloudflare yang dijamin aman dari pemblokiran CORS browser
                const response = await fetch('https://cloudflare-dns.com', {
                    headers: { 'Accept': 'application/dns-json' }
                });
                const t1 = performance.now();
                
                if (!response.ok) throw new Error('Network error');
                
                const serverDateHeader = response.headers.get('date');
                if (!serverDateHeader) throw new Error('No date header');
                
                const serverTs = new Date(serverDateHeader).getTime();
                const rtt = t1 - t0; 
                
                // Formula Kompensasi Latensi Jaringan Trans-Internet (RTT / 2)
                const correctedServerTime = serverTs + (rtt / 2);
                
                initialLocalTime = correctedServerTime;
                initialPerfTime = performance.now();
                timeOffset = correctedServerTime - Date.now();
                
                badge.className = "badge badge-accurate";
                startText.textContent = "CLOUDFLARE ATOMIC TIME VERIFIED";
                latencyText.textContent = `Deviasi Perangkat: ${timeOffset > 0 ? '+' : ''}${Math.round(timeOffset)}ms | Latensi Jaringan: ${Math.round(rtt)}ms`;
                
            } catch (error) {
                console.error("Mengaktifkan skenario cadangan internal:", error);
                const perfTiming = window.performance.timing;
                if (perfTiming && perfTiming.responseStart > 0) {
                    timeOffset = perfTiming.responseStart - perfTiming.connectStart;
                    initialLocalTime = Date.now() + timeOffset;
                    initialPerfTime = performance.now();
                    
                    badge.className = "badge badge-accurate";
                    startText.textContent = "INTERNAL METADATA SYNCED";
                    latencyText.textContent = `Deviasi Terkoreksi Otomatis: ${timeOffset > 0 ? '+' : ''}${Math.round(timeOffset)}ms`;
                } else {
                    startText.textContent = "LOCAL HIGH-RES TIME ONLY";
                }
            }
        }

        // 2. Generator Gambar Seni Abstrak berbasis Algoritma Chaos Milidetik
        function generateMilisecondArt(currentTotalMs) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Menggunakan milidetik berjalan sebagai basis formula matematika chaos
            const seed = currentTotalMs % 100000;
            
            const cols = 4;
            const rows = 4;
            const cellWidth = canvas.width / cols;
            const cellHeight = canvas.height / rows;

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    // Kalkulasi nilai warna RGB murni dari sisa pecahan milidetik saat ini
                    const r = Math.floor((Math.sin(seed + (i * 10)) + 1) * 127.5);
                    const g = Math.floor((Math.cos(seed + (j * 20)) + 1) * 127.5);
                    const b = Math.floor((Math.sin(seed + (i + j)) + 1) * 127.5);
                    
                    // Render kotak warna acak ke GPU secara instan
                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.25)`;
                    ctx.fillRect(i * cellWidth, j * cellHeight, cellWidth, cellHeight);
                    
                    // Render garis simetris dinamis pelengkap efek futuristik
                    ctx.strokeStyle = `rgba(${g}, ${b}, ${r}, 0.1)`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(i * cellWidth + (seed % cellWidth), j * cellHeight);
                    ctx.lineTo((i + 1) * cellWidth, (j + 1) * cellHeight - (seed % cellHeight));
                    ctx.stroke();
                }
            }
        }

        // 3. Main Engine Loop Jam (60FPS - 144FPS+ Mengikuti Monitor)
        function runHighResClock() {
            const elapsed = performance.now() - initialPerfTime;
            const currentTotalMs = initialLocalTime + elapsed;
            
            const accurateNow = new Date(currentTotalMs);
            
            // Format Waktu Utama
            const hours = String(accurateNow.getHours()).padStart(2, '0');
            const minutes = String(accurateNow.getMinutes()).padStart(2, '0');
            const seconds = String(accurateNow.getSeconds()).padStart(2, '0');
            
            // Format Sub-Detik (Skala Mikrodetik 6 Digit)
            const totalMicroseconds = Math.floor((currentTotalMs % 1000) * 1000);
            const microStr = String(totalMicroseconds).padStart(6, '0');
            
            // Render Teks ke Layar
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
            document.getElementById('microseconds').textContent = `.${microStr}`;
            
            // Format Tanggal Indonesia Resmi
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = accurateNow.toLocaleDateString('id-ID', options);
            
            // Regenerasi Gambar Latar Belakang per Milidetik
            generateMilisecondArt(currentTotalMs);
            
            // Menjaga perputaran tetap sinkron dengan refresh rate kartu grafis browser
            requestAnimationFrame(runHighResClock);
        }

        // Eksekusi Sistem Utama
        runHighResClock();
        syncWithAtomicServer();

        // Lakukan sinkronisasi ulang berkala setiap 5 menit agar jam tidak mengalami drift
        setInterval(syncWithAtomicServer, 300000);
    </script>
</body>
</html>
