<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jam Presisi Ekstrem - Ruang Angka Kuantum</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000000; /* Hitam Pekat */
            color: #ffffff; /* Angka Jam Putih Bersih */
            user-select: none;
            overflow: hidden;
            position: relative;
        }
        /* Kanvas Angka Acak Biru Gelap Melayang Bebas */
        #quantumCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        /* Jam Telanjang Tanpa Menu, Tanpa Kotak, Mengapung di Atas Canvas */
        .clock-container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 1200px;
            z-index: 2;
            pointer-events: none; /* Klik tembus ke background jika nanti butuh interaksi */
        }
        .time-display {
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
            line-height: 0.9;
            display: flex;
            justify-content: center;
            align-items: baseline;
            flex-wrap: wrap;
            /* Efek pendaran cahaya tipis agar jam kontras di atas angka melayang */
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.9); 
        }
        .time-main {
            font-size: 15vw;
        }
        .time-sub {
            font-size: 3.8vw;
            opacity: 0.5;
            font-family: monospace;
            margin-left: 15px;
            color: #00ff66; /* Warna mikrodetik hijau neon penanda presisi atom */
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }
        .date {
            font-size: 1.5rem;
            margin-top: 30px;
            opacity: 0.5;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
        }
        .status-container {
            margin-top: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 9999px;
            letter-spacing: 0.1em;
            opacity: 0.7;
        }
        .badge-syncing {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }
        .badge-accurate {
            background: rgba(0, 229, 255, 0.1);
            color: #00e5ff; /* Indikator sinkronisasi biru langit */
        }
        .pulse {
            width: 6px;
            height: 6px;
            background-color: currentColor;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        .latency-info {
            font-size: 0.7rem;
            opacity: 0.3;
            font-family: monospace;
            letter-spacing: 0.02em;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <!-- Kanvas partikel angka melayang bebas -->
    <canvas id="quantumCanvas"></canvas>

    <div class="clock-container">
        <!-- Tampilan Utama Jam Telanjang -->
        <div class="time-display">
            <span class="time-main" id="clock">00:00:00</span>
            <span class="time-sub" id="microseconds">.000000</span>
        </div>
        
        <!-- Tampilan Tanggal -->
        <div class="date" id="date">CALIBRATING TIME...</div>
        
        <!-- Teks Validitas Jaringan -->
        <div class="status-container">
            <div id="statusBadge" class="badge badge-syncing">
                <span class="pulse"></span>
                <span id="statusText">CONNECTING TO CLOUDFLARE ATOMIC EDGE...</span>
            </div>
            <div id="latencyText" class="latency-info">Calculating local device drift...</div>
        </div>
    </div>
    <script>
        let timeOffset = 0; 
        let initialLocalTime = Date.now();
        let initialPerfTime = performance.now();

        // Setup Kanvas Quantum Particle
        const canvas = document.getElementById('quantumCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 120; // Jumlah angka acak biru gelap yang melayang bebas

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Menginisialisasi objek angka melayang dengan parameter bebas acak
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    // Kecepatan gerak bebas acak (bisa ke atas, bawah, kanan, kiri)
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    // Karakter angka awal acak 0-9
                    char: Math.floor(Math.random() * 10).toString(),
                    // Ukuran font bervariasi untuk menciptakan efek kedalaman ruang (3D depth)
                    fontSize: Math.floor(Math.random() * 24) + 12,
                    // Transparansi biru gelap agar tetap berada samar di latar belakang
                    alpha: Math.random() * 0.25 + 0.05
                });
            }
        }

        // Menggambar dan memperbarui posisi angka bebas di layar tiap frame
        function drawQuantumBackground() {
            // Memberikan efek jejak samar (fade trail) tipis di setiap pergerakan angka
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];

                // Acak ulang karakter angka secara real-time di memori setiap milidetik berjalan
                if (Math.random() < 0.03) {
                    p.char = Math.floor(Math.random() * 10).toString();
                }

                // Gambar angka ke kanvas dengan warna Biru Gelap
                ctx.fillStyle = `rgba(16, 52, 166, ${p.alpha})`; // Warna Biru Gelap Safir/Indanthrone
                ctx.font = `bold ${p.fontSize}px monospace`;
                ctx.fillText(p.char, p.x, p.y);

                // Perbarui posisi koordinat berdasarkan vektor kecepatan acaknya
                p.x += p.vx;
                p.y += p.vy;

                // Efek memantul jika angka melayang menabrak batas ujung layar browser
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
            }
        }

        // 1. Sinkronisasi Jam Akurat Murni dengan Server Atom Cloudflare
        async function syncWithAtomicServer() {
            const startText = document.getElementById('statusText');
            const latencyText = document.getElementById('latencyText');
            const badge = document.getElementById('statusBadge');
            
            try {
                const t0 = performance.now();
                const response = await fetch('https://cloudflare-dns.com', {
                    headers: { 'Accept': 'application/dns-json' }
                });
                const t1 = performance.now();
                
                if (!response.ok) throw new Error('Network error');
                
                const serverDateHeader = response.headers.get('date');
                if (!serverDateHeader) throw new Error('No date header');
                
                const serverTs = new Date(serverDateHeader).getTime();
                const rtt = t1 - t0; 
                
                const correctedServerTime = serverTs + (rtt / 2);
                
                initialLocalTime = correctedServerTime;
                initialPerfTime = performance.now();
                timeOffset = correctedServerTime - Date.now();
                
                badge.className = "badge badge-accurate";
                startText.textContent = "CLOUDFLARE ATOMIC TIME VERIFIED";
                latencyText.textContent = `Deviasi Perangkat: ${timeOffset > 0 ? '+' : ''}${Math.round(timeOffset)}ms | Latensi Jaringan: ${Math.round(rtt)}ms`;
                
            } catch (error) {
                console.error("Mengaktifkan skenario cadangan internal:", error);
                const perfTiming = window.performance.timing;
                if (perfTiming && perfTiming.responseStart > 0) {
                    timeOffset = perfTiming.responseStart - perfTiming.connectStart;
                    initialLocalTime = Date.now() + timeOffset;
                    initialPerfTime = performance.now();
                    
                    badge.className = "badge badge-accurate";
                    startText.textContent = "INTERNAL METADATA SYNCED";
                    latencyText.textContent = `Deviasi Terkoreksi: ${timeOffset > 0 ? '+' : ''}${Math.round(timeOffset)}ms`;
                } else {
                    startText.textContent = "LOCAL HIGH-RES TIME ONLY";
                }
            }
        }

        // 2. Engine Loop Utama (Sinkronisasi dengan refresh rate GPU/Monitor)
        function runHighResClock() {
            const elapsed = performance.now() - initialPerfTime;
            const currentTotalMs = initialLocalTime + elapsed;
            
            const accurateNow = new Date(currentTotalMs);
            
            // Format Jam Utama Telanjang
            const hours = String(accurateNow.getHours()).padStart(2, '0');
            const minutes = String(accurateNow.getMinutes()).padStart(2, '0');
            const seconds = String(accurateNow.getSeconds()).padStart(2, '0');
            
            // Format Sub-Detik (Skala Mikrodetik 6 Digit)
            const totalMicroseconds = Math.floor((currentTotalMs % 1000) * 1000);
            const microStr = String(totalMicroseconds).padStart(6, '0');
            
            // Render Teks ke Layar
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
            document.getElementById('microseconds').textContent = `.${microStr}`;
            
            // Format Tanggal Indonesia Resmi
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = accurateNow.toLocaleDateString('id-ID', options);
            
            // Render Animasi Latar Belakang Angka Biru Gelap Melayang Bebas
            drawQuantumBackground();
            
            // Loop kontinu presisi tinggi
            requestAnimationFrame(runHighResClock);
        }

        // Eksekusi Sistem Utama
        initParticles();
        runHighResClock();
        syncWithAtomicServer();

        // Ambil ulang sampel server atom setiap 5 menit agar jam tidak melesat
        setInterval(syncWithAtomicServer, 300000);
    </script>
</body>
</html>
